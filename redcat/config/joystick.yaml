joy_node:
  ros__parameters:
    device_id: 0
    deadzone: 0.05
    autorepeat_rate: 20.0

teleop_node:
  ros__parameters:
    publish_stamped_twist: false
    axis_linear:
      x: 1
    scale_linear: 
      x: 2.0
    scale_linear_turbo: 
      x: 4.0

    axis_angular:
      yaw: 2
    scale_angular: 
      yaw: 20.0
    scale_angular_turbo: 
      yaw: 40.0

    enable_button: 6
    enable_turbo_button: 7

    require_enable_button: true

